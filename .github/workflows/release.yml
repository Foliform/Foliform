name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  make:
    name: Build ${{ matrix.os }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set app version from release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Install app dependencies
        run: npm ci

      - name: Make desktop installers
        run: npm run make

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: make
    runs-on: ubuntu-latest
    steps:
      - name: Download all release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Publish beta or stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Foliform ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-files/**
